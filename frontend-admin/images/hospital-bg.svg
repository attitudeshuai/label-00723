<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d4a6f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a365d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2c5282;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4299e1;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Abstract medical patterns -->
  <g opacity="0.1">
    <!-- DNA helix pattern -->
    <path d="M100,0 Q150,100 100,200 Q50,300 100,400 Q150,500 100,600 Q50,700 100,800 Q150,900 100,1000 Q50,1100 100,1200" 
          stroke="#63b3ed" stroke-width="2" fill="none"/>
    <path d="M130,0 Q80,100 130,200 Q180,300 130,400 Q80,500 130,600 Q180,700 130,800 Q80,900 130,1000 Q180,1100 130,1200" 
          stroke="#63b3ed" stroke-width="2" fill="none"/>
    
    <path d="M1800,0 Q1850,100 1800,200 Q1750,300 1800,400 Q1850,500 1800,600 Q1750,700 1800,800 Q1850,900 1800,1000" 
          stroke="#63b3ed" stroke-width="2" fill="none"/>
    <path d="M1830,0 Q1780,100 1830,200 Q1880,300 1830,400 Q1780,500 1830,600 Q1880,700 1830,800 Q1780,900 1830,1000" 
          stroke="#63b3ed" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Hospital building silhouette -->
  <g opacity="0.15">
    <!-- Main building -->
    <rect x="700" y="400" width="520" height="680" fill="url(#buildingGrad)" rx="5"/>
    <!-- Cross symbol -->
    <rect x="920" y="450" width="80" height="200" fill="#4299e1" opacity="0.5"/>
    <rect x="880" y="490" width="160" height="80" fill="#4299e1" opacity="0.5"/>
    <!-- Windows -->
    <g fill="#63b3ed" opacity="0.3">
      <rect x="730" y="550" width="40" height="50" rx="3"/>
      <rect x="790" y="550" width="40" height="50" rx="3"/>
      <rect x="850" y="550" width="40" height="50" rx="3"/>
      <rect x="1030" y="550" width="40" height="50" rx="3"/>
      <rect x="1090" y="550" width="40" height="50" rx="3"/>
      <rect x="1150" y="550" width="40" height="50" rx="3"/>
      
      <rect x="730" y="650" width="40" height="50" rx="3"/>
      <rect x="790" y="650" width="40" height="50" rx="3"/>
      <rect x="850" y="650" width="40" height="50" rx="3"/>
      <rect x="1030" y="650" width="40" height="50" rx="3"/>
      <rect x="1090" y="650" width="40" height="50" rx="3"/>
      <rect x="1150" y="650" width="40" height="50" rx="3"/>
      
      <rect x="730" y="750" width="40" height="50" rx="3"/>
      <rect x="790" y="750" width="40" height="50" rx="3"/>
      <rect x="850" y="750" width="40" height="50" rx="3"/>
      <rect x="1030" y="750" width="40" height="50" rx="3"/>
      <rect x="1090" y="750" width="40" height="50" rx="3"/>
      <rect x="1150" y="750" width="40" height="50" rx="3"/>
    </g>
    
    <!-- Side buildings -->
    <rect x="500" y="550" width="200" height="530" fill="url(#buildingGrad)" rx="5"/>
    <rect x="1220" y="550" width="200" height="530" fill="url(#buildingGrad)" rx="5"/>
  </g>
  
  <!-- Floating medical icons -->
  <g opacity="0.08" fill="#90cdf4">
    <!-- Heartbeat line -->
    <path d="M50,200 L100,200 L120,150 L140,250 L160,180 L180,220 L200,200 L250,200" 
          stroke="#90cdf4" stroke-width="3" fill="none"/>
    
    <!-- Stethoscope -->
    <circle cx="1700" cy="150" r="30" fill="none" stroke="#90cdf4" stroke-width="3"/>
    <path d="M1670,150 Q1650,200 1680,250" stroke="#90cdf4" stroke-width="3" fill="none"/>
    
    <!-- Pills -->
    <ellipse cx="200" cy="800" rx="25" ry="12" fill="#90cdf4"/>
    <ellipse cx="1750" cy="700" rx="25" ry="12" fill="#90cdf4"/>
    
    <!-- Medical cross -->
    <rect x="1600" y="850" width="20" height="60" fill="#90cdf4"/>
    <rect x="1580" y="870" width="60" height="20" fill="#90cdf4"/>
    
    <rect x="250" y="450" width="15" height="45" fill="#90cdf4"/>
    <rect x="235" y="465" width="45" height="15" fill="#90cdf4"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="200" fill="#4299e1" opacity="0.05"/>
  <circle cx="1800" cy="900" r="250" fill="#63b3ed" opacity="0.05"/>
  <circle cx="960" cy="100" r="150" fill="#90cdf4" opacity="0.03"/>
  <circle cx="400" cy="800" r="180" fill="#4299e1" opacity="0.04"/>
  <circle cx="1600" cy="300" r="120" fill="#63b3ed" opacity="0.04"/>
  
  <!-- Grid pattern overlay -->
  <g opacity="0.02" stroke="#fff" stroke-width="1">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>
</svg>