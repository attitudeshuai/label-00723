<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医院设备管理系统 - 管理后台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">🏥</div>
                <h1>医院设备管理系统</h1>
                <p>管理后台</p>
            </div>
            <form id="loginForm" class="login-form">
                <div id="loginError" class="login-error hidden">
                    <span>⚠️</span>
                    <span id="loginErrorMsg">用户名或密码错误</span>
                </div>
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="请输入密码" required>
                        <button type="button" class="password-toggle" id="togglePassword" title="显示密码">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登 录</button>
            </form>
            <div class="login-footer">
                <p>© 2024 医院设备管理系统</p>
            </div>
        </div>
    </div>

    <!-- 主应用 -->
    <div id="app" class="app hidden">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="logo">🏥</span>
                <span class="title">设备管理系统</span>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item active" data-page="dashboard">
                        <span class="icon">📊</span>
                        <span class="text">仪表盘</span>
                    </li>
                    <li class="nav-item" data-page="category">
                        <span class="icon">📁</span>
                        <span class="text">设备分类</span>
                    </li>
                    <li class="nav-item" data-page="equipment">
                        <span class="icon">🔧</span>
                        <span class="text">设备字典</span>
                    </li>
                    <li class="nav-item" data-page="inventory">
                        <span class="icon">📦</span>
                        <span class="text">设备明细</span>
                    </li>
                    <li class="nav-item" data-page="stockIn">
                        <span class="icon">📥</span>
                        <span class="text">设备入库</span>
                    </li>
                    <li class="nav-item" data-page="stockOut">
                        <span class="icon">📤</span>
                        <span class="text">设备出库</span>
                    </li>
                    <li class="nav-item" data-page="depreciation">
                        <span class="icon">📉</span>
                        <span class="text">设备折旧</span>
                    </li>
                    <li class="nav-item" data-page="scrap">
                        <span class="icon">🗑️</span>
                        <span class="text">设备报废</span>
                    </li>
                    <li class="nav-item" data-page="repair">
                        <span class="icon">🔨</span>
                        <span class="text">设备维修</span>
                    </li>
                    <li class="nav-group">
                        <span class="group-title">报表中心</span>
                    </li>
                    <li class="nav-item" data-page="reportStockIn">
                        <span class="icon">📋</span>
                        <span class="text">入库报表</span>
                    </li>
                    <li class="nav-item" data-page="reportStockOut">
                        <span class="icon">📋</span>
                        <span class="text">出库报表</span>
                    </li>
                    <li class="nav-item" data-page="reportInventory">
                        <span class="icon">📋</span>
                        <span class="text">存放明细</span>
                    </li>
                    <li class="nav-item" data-page="reportDepreciation">
                        <span class="icon">📋</span>
                        <span class="text">折旧报表</span>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部导航 -->
            <header class="header">
                <div class="header-left">
                    <button class="btn-icon" id="toggleSidebar">☰</button>
                    <h2 id="pageTitle">仪表盘</h2>
                </div>
                <div class="header-right">
                    <span class="user-info">
                        <span class="user-name" id="currentUser">管理员</span>
                        <span class="user-role" id="currentRole">admin</span>
                    </span>
                    <button class="btn btn-outline" id="logoutBtn">退出</button>
                </div>
            </header>

            <!-- 页面内容 -->
            <div class="content" id="pageContent">
                <!-- 动态加载页面内容 -->
            </div>
        </main>
    </div>

    <!-- 模态框 -->
    <div id="modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">标题</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 动态内容 -->
            </div>
            <div class="modal-footer" id="modalFooter">
                <button class="btn btn-outline modal-cancel">取消</button>
                <button class="btn btn-primary modal-confirm">确定</button>
            </div>
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="toast hidden">
        <span class="toast-icon"></span>
        <span class="toast-message"></span>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/pages2.js"></script>
    <script src="js/pages3.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
